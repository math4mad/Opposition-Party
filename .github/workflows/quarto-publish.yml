name: Quarto Publish

on:
  push:
    branches: [main]
    paths:
      - "notes/**"
      - "external/dialogue/**"
      - "tools/render-dialogue.mjs"
      - ".github/workflows/quarto-publish.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build and publish to gh-pages
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: notes
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: release

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Quarto dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Generate Idea.qmd from chat export
        run: |
          cd "$GITHUB_WORKSPACE"
          node tools/render-dialogue.mjs \
            external/dialogue/chat-export-1792470087192.json \
            notes/Idea.qmd

      - name: Render Quarto site
        run: quarto render

      - name: Publish to gh-pages branch
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          rm -rf .publish
          git worktree add --detach .publish origin/gh-pages
          cd .publish
          git reset --hard
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R "$GITHUB_WORKSPACE/notes/_site/." .
          touch .nojekyll
          git add -A
          git commit -m "Publish site: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" || echo "no changes to publish"
          git push origin HEAD:gh-pages --force
